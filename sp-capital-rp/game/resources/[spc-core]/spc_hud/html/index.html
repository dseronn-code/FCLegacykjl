<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>SP Capital HUD</title><link rel="stylesheet" href="style.css"></head>
<body>
  <div id="hud" hidden>
    <div id="compass"><span id="dir">N</span><span id="street"></span></div>
    <div id="bars">
      <div class="bar health" title="Vida"><i style="--v:100"></i></div>
      <div class="bar armor" title="Colete"><i style="--v:0"></i></div>
      <div class="bar hunger" title="Fome"><i style="--v:100"></i></div>
      <div class="bar thirst" title="Sede"><i style="--v:100"></i></div>
      <div class="bar stress" title="Estresse"><i style="--v:0"></i></div>
      <div id="voice" title="Voz"><b></b><b></b><b></b></div>
      <div id="radio" hidden></div>
    </div>
    <div id="vehicle" hidden>
      <div id="speed">0</div><small>km/h</small>
      <div class="bar fuel" title="Combustível"><i style="--v:100"></i></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
