# Ambiente local de desenvolvimento: MariaDB + Redis.
# Uso: docker compose -f infra/docker-compose.dev.yml up -d
services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: dev
      MARIADB_DATABASE: spcapital
    ports: ["127.0.0.1:3306:3306"]
    volumes:
      - ./mariadb/spc.cnf:/etc/mysql/conf.d/spc.cnf:ro
      - mariadb-data:/var/lib/mysql
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis-data:/data]
volumes:
  mariadb-data:
  redis-data:
